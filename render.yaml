services:
  - type: web
    name: geekify-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # One process only: every extra worker re-loads yt-dlp (~200 MB) and OOMs a 512 MB box.
      - key: WEB_CONCURRENCY
        value: "1"
      # Stop glibc from giving every thread its own big heap; return freed memory sooner.
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: MALLOC_TRIM_THRESHOLD_
        value: "131072"
      - key: YTDLP_MAX_CONCURRENT
        value: "1"
      # Shared memory budget (see backend/app/memguard.py). Light YouTube Music requests cost 1 unit,
      # a yt-dlp run (+ its Deno child) costs 3 of 4, so they can never all run at once.
      - key: MEM_BUDGET
        value: "4"
      - key: MEM_YTDLP_COST
        value: "3"
      # Above SOFT we force a GC + malloc_trim; above HARD new work waits, then gets a 503
      # (+ Retry-After) instead of the whole container being OOM-killed at 512 MB.
      - key: MEM_SOFT_MB
        value: "360"
      - key: MEM_HARD_MB
        value: "430"
      # Fewer worker threads = fewer simultaneous multi-MB JSON documents and malloc arenas.
      - key: MAX_THREADS
        value: "10"
    plan: free
